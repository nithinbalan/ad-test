<body style=" font-family: 'Lexend Deca', sans-serif;">
  <div class="heade" style="border-top: 1px solid #DEDEDE;">
    <div style="padding: 15 32px; overflow: hidden; font-size: 13px; padding-top: 15px;">
        <div style="float:left;">www.jethur.com</div>
        <div style="float:right;">Page No <span class="page"></span> of <span class="topage"></span></div>
    </div>
</div>
    <script>
        var vars = {};
        var query_strings = document.location.search.substring(1).split('&');
        for (var i in query_strings) {
            if (query_strings.hasOwnProperty(i)) {
                var pair = query_strings[i].split('=', 2);
                vars[pair[0]] = decodeURIComponent(pair[1]);
            }
        }
        document.querySelector('.page').textContent = vars.page || '';
        document.querySelector('.topage').textContent = vars.topage || '';

         if (vars.page && parseInt(vars.page) === 1) {
          var footer = document.querySelector('.heade');
          if (footer) footer.style.display = 'none';
      }
    </script>
</body>
