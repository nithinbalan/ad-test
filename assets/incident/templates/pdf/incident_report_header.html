<!DOCTYPE html>
<html>
<head>
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
   <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous"> -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

</head>
<body style=" font-family: 'Lexend Deca', sans-serif;">
   <div class="heade" style="border-bottom: 1px solid #DEDEDE;">
    <div style="padding: 15px 32px 0 32px; text-align: right;">
        <img id="header-logo" src="{{.ApiPath}}/report-template-settings/image-preview?type=logo" />
    </div>
</div>
</body>
<script>
        // Hide header only on first page
        var vars = {};
        var query_strings = document.location.search.substring(1).split('&');
        for (var i in query_strings) {
            if (query_strings.hasOwnProperty(i)) {
                var pair = query_strings[i].split('=', 2);
                vars[pair[0]] = decodeURIComponent(pair[1]);
            }
        }

        if (vars.page && parseInt(vars.page) === 1) {
            var header = document.querySelector('.heade');
            if (header) header.style.display = 'none';
        }
    </script>
</html>
