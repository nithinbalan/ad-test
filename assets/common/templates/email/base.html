<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title></title>

    <!-- CSS Reset : BEGIN -->
    <style>
        html, body {
            margin: 0 auto !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
        }

        * {
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }

        p {
            font-size: 16px;
        }

        div[style*="margin: 16px 0"] {
            margin: 0 !important;
        }

        table, td {
            mso-table-lspace: 0pt !important;
            mso-table-rspace: 0pt !important;
        }

        th {
            font-weight: normal;
        }

        table {
            border-spacing: 0 !important;
            table-layout: fixed !important;
            margin: 0 auto !important;
        }

        a {
            text-decoration: none;
        }

        img {
            -ms-interpolation-mode: bicubic;
        }

        a[x-apple-data-detectors], .unstyle-auto-detected-links a, .aBn {
            border-bottom: 0 !important;
            cursor: default !important;
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
        }

        .im {
            color: inherit !important;
        }

        .a6S {
            display: none !important;
            opacity: 0.01 !important;
        }

        img.g-img+div {
            display: none !important;
        }

        /* Additional CSS */
        .email-container {
            background-color: #f5f5f5;
            padding: 0;
        }

        .content {
            padding: 40px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: 500;
            line-height: 22px;
        }
    </style>
    <!-- CSS Reset : END -->
</head>

<body width="100%" style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; background-color: #f5f5f5;">
    <center role="article" aria-roledescription="email" lang="en" style="width: 100%; background-color: #f5f5f5;">
        <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" class="email-container">
            <tr>
                <td></td>
                <td width="600">
                    <!-- Include Header Template -->
                    {{ template "header" . }}

                    <!-- Main Content -->
                    <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="background-color: #fff;">
                        <tr>
                            <td class="content">
                                {{ block "content" . }}{{ end }}
                            </td>
                        </tr>
                    </table>

                    <!-- Support and Contact Information -->
                    <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="background-color: #fff;">
                        <tr>
                            <td style="padding: 20px; text-align: left; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px;">
                                <p>For any assistance or questions, feel free to reach out to our support team at <a href="mailto:info@jethur.com">info@jethur.com</a> or +61 7536563635.</p>
                                <p>Best regards,<br>Jethur GRC Team</p>
                            </td>
                        </tr>
                    </table>

                    <!-- Include Footer Template -->
                    {{ template "footer" . }}

                </td>
                <td></td>
            </tr>
        </table>
    </center>
</body>

</html>
