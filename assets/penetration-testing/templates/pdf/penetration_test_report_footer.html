<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <style>
    @font-face {
      font-family: 'Lexend Deca';
      src: url('{{.LexandDecaFont100}}') format('woff');
      font-weight: 100;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lexend Deca';
      src: url('{{.LexandDecaFont200}}') format('woff');
      font-weight: 200;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lexend Deca';
      src: url('{{.LexandDecaFont300}}') format('woff');
      font-weight: 300;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lexend Deca';
      src: url('{{.LexandDecaFont400}}') format('woff');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lexend Deca';
      src: url('{{.LexandDecaFont500}}') format('woff');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Lexend Deca';
      src: url('{{.LexandDecaFont600}}') format('woff');
      font-weight: 600;
      font-style: normal;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Lexend Deca', sans-serif;
      font-size: 10px;
    }
  </style>
</head>

<body style="font-family: 'Lexend Deca', sans-serif;">
  <div style="border-top: 1px solid #DEDEDE; margin-left: 60px; margin-right: 60px;">
    <div style="padding-right: 32px; padding-top: 10px; overflow: hidden; font-size: 10px; margin-top: 15px;">
      <div style="float:left; color:#444;">www.alshaya.com</div>
      <div style="float:right; color:#444;">Page <span class="page"></span></div>
    </div>
  </div>
  <script>
    var vars = {};
    var query_strings = document.location.search.substring(1).split('&');
    for (var i in query_strings) {
      if (query_strings.hasOwnProperty(i)) {
        var pair = query_strings[i].split('=', 2);
        vars[pair[0]] = decodeURIComponent(pair[1]);
      }
    }
    document.querySelector('.page').textContent = vars.page || '';
  </script>
</body>

</html>
