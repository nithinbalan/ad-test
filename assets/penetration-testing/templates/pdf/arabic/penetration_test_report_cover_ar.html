<html lang="ar" dir="rtl" xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet" />
  <style>
    body { direction: rtl; text-align: right; line-height: 1.2; }
    html {
      margin: 0;
    }

  </style>
</head>

<body style="font-family: 'Almarai', sans-serif; margin:0; padding:0; background:#fff;">
  <div style="width: 1000px; margin: 0 auto; background: #fff;">
    <div style="
      height: 1176px;
      background: url({{.ApiPath}}/report-template-settings/image-preview?type=cover-page-bg) 0 0 no-repeat;
      background-size: cover;
      background-position: center;
      padding: 10px 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;">

      <img src="{{.ApiPath}}/report-template-settings/image-preview?type=logo" alt="الشعار"
        style="position: absolute; top: 40px; left: 40px; max-height: 150px; max-width: 350px; margin-top: 20px; margin-left: 20px;" />

      <h1 style="
        font-size: 40px;
        color: #000;
        position: absolute;
        bottom: 500px;
        text-align: center;
        width: 94%;
        font-weight: 700;
        margin-top: -10px;">
        تقرير اختبار الاختراق
      </h1>
      <h1 style="
        font-size: 30px;
        color: #000;
        position: absolute;
        bottom: 40px;
        text-align: center;
        width: 94%;
        font-weight: 700;
        margin: 0;">
        {{.Data.Title}}
      </h1>
    </div>

    <div style="padding: 20px 40px; background: #2F4C81; color: #fff; height: 160px; padding-bottom: 39.8px;">
      <div style="margin-top: 15px">
        <div style="width: 60%; display: inline-block; vertical-align: top;">
          <p style="margin:0 0 2px 0; color:#fff; font-size:13px; font-weight:300;">العنوان</p>
          <p style="margin:0 0 13px 0; color:#fff; font-size:14px; font-weight:400;">{{.Data.Title}}</p>
        </div>
      </div>
      <div style="margin-top: 20px">
        <div style="width: 30%; display: inline-block; vertical-align: top;">
          <p style="margin:0 0 2px 0; color:#fff; font-size:13px; font-weight:300;">تاريخ التقرير</p>
          <p style="margin:0 0 13px 0; color:#fff; font-size:14px; font-weight:400;"><span dir="ltr" style="display: inline-block;">{{.Data.ReportedAt}}</span></p>
        </div>
        <div style="width: 30%; display: inline-block; vertical-align: top;">
          <p style="margin:0 0 2px 0; color:#fff; font-size:13px; font-weight:300;">أعد التقرير</p>
          <p style="margin:0 0 13px 0; color:#fff; font-size:14px; font-weight:400;">{{.Data.CreatedUserFirstNameAr}}
            {{.Data.CreatedUserLastNameAr}}</p>
        </div>
        <div style="width: 30%; display: inline-block; vertical-align: top;">
          <p style="margin:0 0 2px 0; color:#fff; font-size:13px; font-weight:300;">تاريخ التصدير</p>
          <p style="margin:0 0 13px 0; color:#fff; font-size:14px; font-weight:400;"><span dir="ltr" style="display: inline-block;">{{.Data.GeneratedAt}}</span></p>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
