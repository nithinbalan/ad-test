<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet" />
  <style>
    body { direction: rtl; text-align: right; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Almarai', sans-serif;
      font-size: 10px;
    }
  </style>
</head>

<body style="font-family: 'Almarai', sans-serif;">
  <div style="border-top: 1px solid #DEDEDE; margin-left: 60px; margin-right: 60px;">
    <div style="padding-right: 32px; padding-top: 10px; overflow: hidden; font-size: 10px; margin-top: 15px;">
      <div style="float:left; color:#444;">www.alshaya.com</div>
      <div style="float:right; color:#444;">الصفحة <span class="page"></span></div>
    </div>
  </div>
  <script>
    var vars = {};
    var query_strings = document.location.search.substring(1).split('&');
    for (var i in query_strings) {
      if (query_strings.hasOwnProperty(i)) {
        var pair = query_strings[i].split('=', 2);
        vars[pair[0]] = decodeURIComponent(pair[1]);
      }
    }
    document.querySelector('.page').textContent = vars.page || '';
  </script>
</body>

</html>
