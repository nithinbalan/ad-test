<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<style>
  html {
    margin: 0;
  }

  @font-face {
    font-family: 'Lexend Deca';
    src: url('{{.LexandDecaFont100}}') format('woff');
    font-weight: 100;
    font-style: normal;
  }

  @font-face {
    font-family: 'Lexend Deca';
    src: url('{{.LexandDecaFont200}}') format('woff');
    font-weight: 200;
    font-style: normal;
  }

  @font-face {
    font-family: 'Lexend Deca';
    src: url('{{.LexandDecaFont300}}') format('woff');
    font-weight: 300;
    font-style: normal;
  }

  @font-face {
    font-family: 'Lexend Deca';
    src: url('{{.LexandDecaFont400}}') format('woff');
    font-weight: 400;
    font-style: normal;
  }

  @font-face {
    font-family: 'Lexend Deca';
    src: url('{{.LexandDecaFont500}}') format('woff');
    font-weight: 500;
    font-style: normal;
  }

  @font-face {
    font-family: 'Lexend Deca';
    src: url('{{.LexandDecaFont600}}') format('woff');
    font-weight: 600;
    font-style: normal;
  }
</style>

<body style="font-family: 'Lexend Deca', sans-serif; box-sizing: border-box; color: #000; height: 100%; hyphens: auto; line-height: 1.4; margin: 0; -moz-hyphens: auto; -ms-word-break: break-all; width: 100% !important; -webkit-hyphens: auto; -webkit-text-size-adjust: none; word-break: break-word;">
  <div style="width: 100%; padding: 0 32px; box-sizing: border-box;">
    <div style="border-bottom: 1px solid #e5e7eb; padding: 10px 0; display: flex; justify-content: space-between; align-items: center;">
      <div style="width: 50%;">
        <img src="{{.ApiPath}}/report-template-settings/image-preview?type=logo" style="height: 40px;">
      </div>
      <div style="width: 50%; text-align: right;">
        <p style="margin: 0; font-size: 11px; color: #6b7280; font-weight: 300;">Test & Exercise</p>
        <p style="margin: 0; font-size: 12px; color: #111827; font-weight: 400;">{{.Data.ReferenceNumber}}</p>
      </div>
    </div>
  </div>
</body>

</html>
