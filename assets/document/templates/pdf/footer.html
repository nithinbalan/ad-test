<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin-top: 0;
      padding: 0;
      font-family: 'Lexend Deca', sans-serif;
      font-size: 13px;
      color: #333;
    }
    .footer {
      width: 100%;
      padding: 5px 10px;
      border-top: 1px solid #DEDEDE;
      display: flex;
      justify-content: space-between;
    }
    .line {
      width: 100%;
      height: 1px; /* thickness of the line */
      background-color: #DEDEDE; /* custom color */
    }
  </style>
</head>
<body>
    <div style="padding: 20px 5px;">
        <div class="header" style="border-top: 1px solid #DEDEDE; padding-top: 20px; padding-bottom: 20px; text-align: right;">
            <div>
            <div style="float:left; font-size: 13px;">{{.Data.AppUrl}}</div>
            <div style="float:right; font-size: 13px;">
              <div style="float:right; font-size: 13px;">
                Page <span class="page"></span>
              </div>
            </div>
                     <!-- <div>Page <span class="page"></span> of <span class="topage"></span></div> -->
            </div>
        </div>
    </div>

    <script>
        var vars = {};
        var query_strings = document.location.search.substring(1).split('&');
        for (var i in query_strings) {
            if (query_strings.hasOwnProperty(i)) {
                var pair = query_strings[i].split('=', 2);
                vars[pair[0]] = decodeURIComponent(pair[1]);
            }
        }
        document.querySelector('.page').textContent = vars.page || '';
        document.querySelector('.topage').textContent = vars.topage || '';
    </script>

</body>
</html>
