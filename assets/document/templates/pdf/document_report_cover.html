<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <style>
    @font-face {
      font-family: 'Lexend Deca';
      src: url('{{.LexandDecaFont400}}') format('woff');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Lexend Deca';
      src: url('{{.LexandDecaFont600}}') format('woff');
      font-weight: 600;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: 'Lexend Deca', sans-serif;
      color: #fff;
      background: #c66a14;
    }
    .cover {
      width: 100%;
      height: 1403px;
      background: url({{.ApiPath}}/report-template-settings/image-preview?type=cover-page-bg) no-repeat center center;
      background-size: cover;
      padding: 24px;
      position: relative;
    }
    .logo-badge {
      width: 190px;
      height: 90px;
      padding: 8px;
      background: #00c4b3;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      position: absolute;
      top: 30px;
      left: 30px;
      overflow: hidden;
    }
    .logo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }
    .middle {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 52px;
      position: absolute;
      left: 24px;
      right: 24px;
      top: 40%;
      transform: translateY(-50%);
    }
    .title-block { width: 100%; text-align: center; }
    .title-line {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.55);
      width: 100%;
    }
    .title-main {
      font-size: 52px;
      font-weight: 600;
      line-height: 1.12;
      margin: 20px 0;
      word-break: break-word;
    }
    .footer-bar {
      width: calc(100% - 50px);
      font-size: 18px;
      position: absolute;
      left: 25px;
      right: 25px;
      bottom: 20px;
    }
    .footer-left { float: left; }
    .footer-right { float: right; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="logo-badge">
      <img class="logo" src="{{.ApiPath}}/report-template-settings/image-preview?type=logo" alt="logo" />
    </div>

    <div class="middle">
      <div class="title-block">
        <hr class="title-line" />
        <div class="title-main">Document Report</div>
        <div class="title-main">{{.Data.Title}}</div>
        <hr class="title-line" />
      </div>
    </div>

    <div class="footer-bar">
      <span class="footer-left">Prepared by: {{.Data.CreatedBy.FirstNameEN}} {{.Data.CreatedBy.LastNameEN}}</span>
      <span class="footer-right">Date: {{.Data.CreatedAt}}</span>
    </div>
  </div>
</body>
</html>
