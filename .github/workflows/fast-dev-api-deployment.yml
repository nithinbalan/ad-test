name: Fast(devi-api.jethur.com)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: jethur-dev
    steps:


      - name: Cleanup workspace if not empty
        run: |
          $items = Get-ChildItem -Force -Recurse
          if ($items.Count -gt 0) {
            Write-Host "Folder is not empty. Proceeding with cleanup."
            Remove-Item -Recurse -Force * -ErrorAction Continue
            Remove-Item -Recurse -Force .??* -ErrorAction Continue
          } else {
            Write-Host "Folder is empty. No cleanup needed."
          }
          Get-ChildItem -Force
        shell: powershell
          
      # Step: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step: Set Go Path
      - name: Set Go Path
        run: |
          $env:PATH = "C:\Program Files\Go\bin;$env:PATH"
        shell: powershell


      # Step: Download script.bat from Server
      - name: Download script.bat
        run: |
          $sourcePath = "C:\deployment\deployment-files\script.bat"
          $destinationPath = "${{ github.workspace }}\script.bat"

          # Copy script.bat from server to workspace
          Copy-Item -Path $sourcePath -Destination $destinationPath -Force
        shell: powershell

      # Step: Modify script.bat for Database Name
      - name: Modify script.bat for Database Name
        run: |
          $scriptPath = "${{ github.workspace }}\script.bat"
          $staticDatabaseName = "jethur_dev_db" # Replace with your static database name

          # Replace 'DatabasetName' with the static database name
          (Get-Content -Path $scriptPath) -replace "DatabaseName", $staticDatabaseName | Set-Content -Path $scriptPath
        shell: powershell

      # Step: Switch to migration_new Branch and Run Migrations
      - name: Switch to migration_new Branch
        run: |
          git fetch origin migration_new # Fetch the specific branch from the remote
          git checkout migration_new

      # Step: Stop NSSM Task
      - name: Stop NSSM Task
        run: nssm stop dev-api
        shell: powershell

      - name: Run Migrations and Seed
        run: |
          .\script.bat migrateup
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\script.bat seed
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: powershell

      # Step: Switch Back to Main Branch
      - name: Switch Back to Main Branch
        run: git checkout main
        
      # Step: Build API
      - name: Build API
        run: go build ./cmd/api

      # Step: Backup and Deploy API Executable
      - name: Backup and Deploy API Executable
        run: |
          $iisDocRoot = "C:\inetpub\wwwroot\dev\dev-api"
          $apiBackup = "$iisDocRoot\api_backup.exe"
          $apiExecutable = "$iisDocRoot\api.exe"

          # Delete the old backup file if it exists
          if (Test-Path $apiBackup) {
              Remove-Item -Force $apiBackup
          }

          # Rename existing executable to backup
          if (Test-Path $apiExecutable) {
              Rename-Item -Path $apiExecutable -NewName "api_backup.exe"
          }

          # Copy new executable to IIS document root
          Copy-Item -Path "${{ github.workspace }}\api.exe" -Destination $iisDocRoot
        shell: powershell
        
      # Step: Start NSSM Task 
      - name: Start NSSM Service
        run: nssm start dev-api
        continue-on-error: true
        
      # Step: Status check NSSM Task
      - name: Status NSSM Service
        run: nssm status dev-api

      # Step: Restart IIS Site and Application Pool
      - name: Restart IIS Site and App Pool
        run: |
          $siteName = "dev-api"

          # Import IIS WebAdministration module
          Import-Module WebAdministration

          # Get the App Pool name associated with the site
          $appPoolName = (Get-Item "IIS:\Sites\$siteName").applicationPool

          Write-Output "Stopping site: $siteName"
          if ((Get-Website -Name $siteName).State -eq "Started") {
          Stop-Website -Name $siteName
          }

          Write-Output "Recycling app pool: $appPoolName"
          Restart-WebAppPool -Name $appPoolName

          Write-Output "Starting site: $siteName"
          Start-Website -Name $siteName
        shell: powershell


      # Step: Cleanup build folder
      - name: Cleanup build
        run: |
          Get-ChildItem -Force
          Remove-Item -Recurse -Force * -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force .??* -ErrorAction SilentlyContinue
          Get-ChildItem -Force
        shell: powershell
