name: temp-test

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: jethur-dev
    steps:

          
      # Step: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step: Set Go Path
      - name: Set Go Path
        run: |
          $env:PATH = "C:\Program Files\Go\bin;$env:PATH"
        shell: powershell

      # Step: Verify Go Version
      - name: Verify Go Version
        run: go version
      # Step: switch   
      - name: Switch to migration_new Branch
        run: |
          git fetch origin migration_new # Fetch the specific branch from the remote
          git checkout migration_new

      - name: Force Cleanup Build Directory
        run: |
          Write-Host "Before Cleanup:"
          Get-ChildItem -Force
          $BuildDir = "${{ github.workspace }}"
    
          if (Test-Path $BuildDir) {
          Write-Host "Removing directory: $BuildDir"
          Remove-Item -Recurse -Force $BuildDir -ErrorAction Continue
          Start-Sleep -s 5  # Wait to ensure deletion
          }
    
          Write-Host "After Cleanup:"
          Get-ChildItem -Force
        shell: powershell
