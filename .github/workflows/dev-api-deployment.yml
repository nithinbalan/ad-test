name: dev-api.jethur.com

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: jethur-dev
    env:
  
      PROJECT_NAME: dev-api
      DB_NAME: jethur_dev_db
      DEPLOY_BRANCH: main
      MIGRATION_BRANCH: migration
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      IIS_DOC_ROOT: C:\inetpub\wwwroot\dev\dev-api
      SERVICE_NAME: dev-api
      SCRIPT_SOURCE_PATH: C:\deployment\deployment-files\.env
      EMAIL_TO: nithin@jethur.com, shihab@jethur.com, ranjith@jethur.com, aparna@jethur.com, faisal@jethur.com, suhaila@jethur.com, anoop@jethur.com
      SENDER: "Jethur Notifications <info@jethur.com>"
      EMAIL_FROM: "Jethur Notifications <info@jethur.com>"

    steps:

      - name: Notify Start on Teams
        shell: powershell
        run: |
          # Store environment variables in PowerShell variables for cleaner string construction
          $projectName = $env:PROJECT_NAME
          $githubActor = $env:GITHUB_ACTOR
          $githubRefName = $env:GITHUB_REF_NAME

          # Construct the Teams MessageCard payload
          # The emoji has been removed from the title to prevent encoding issues
          $card = @{
              "@context"   = "http://schema.org/extensions"
              "@type"      = "MessageCard"
              "themeColor" = "0078D7" # A hex color code for the card (e.g., Microsoft Blue)
              "title"      = "Deployment Started" # EMOJI REMOVED HERE
              "text"       = "**${projectName}** deployment started by **${githubActor}** on branch **${githubRefName}**"
          }

          # Convert the PowerShell hashtable to a JSON string
          $body = $card | ConvertTo-Json -Depth 10

          # Set the Content-Type header
          $headers = @{ "Content-Type" = "application/json" }

          # Invoke the web request to the Teams webhook URL
          Invoke-WebRequest -Uri $env:TEAMS_WEBHOOK_URL -Method Post -Headers $headers -Body $body -UseBasicParsing
 
      - name: Pre Cleanup workspace
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning workspace before checkout..."
          Get-ChildItem -Force | ForEach-Object {
          try {
            Remove-Item -Recurse -Force $_.FullName -ErrorAction Stop
            } catch {
          Write-Warning "Could not delete: $($_.FullName) - $_"
          }
          }
          Write-Host "Workspace after cleanup:"
          Get-ChildItem -Force

      - name: Checkout Code
        uses: actions/checkout@v3
        with:
         clean: true
         fetch-depth: 0
        

      - name: Set Go Path
        run: $env:PATH = "C:\Program Files\Go\bin;$env:PATH"
        shell: powershell

      - name: Verify Go Version
        run: go version

      - name: Cache Go Modules
        uses: actions/cache@v3
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download .env
        run: Copy-Item -Path ${{ env.SCRIPT_SOURCE_PATH }} -Destination "${{ github.workspace }}\.env" -Force
        shell: powershell

      - name: Modify .env for Database Name
        run: |
          (Get-Content -Path "${{ github.workspace }}\.env") -replace "DatabaseName", "${{ env.DB_NAME }}" | Set-Content -Path "${{ github.workspace }}\.env"
        shell: powershell

      - name: Stop NSSM Service
        run: nssm stop ${{ env.SERVICE_NAME }}
        shell: powershell

      - name: Merge migration Branch
        run: git pull origin migration

      - name: Build migration.exe
        run: go build -o migration.exe .\cmd\migrate
        shell: powershell

      - name: Run Migrations and Seed
        run: |
          Write-Host "Running database migration..."
          .\migration.exe up
          if ($LASTEXITCODE -ne 0) {
          Write-Error "Migration failed!"
          exit 1
          }

          Write-Host "Running database seed..."
          .\migration.exe seed
          if ($LASTEXITCODE -ne 0) {
          Write-Error "Seeding failed!"
          exit 1
          }


      - name: Install Dependencies
        run: |
          go mod tidy
        shell: powershell

      - name: Build API
        run: go build ./cmd/api

      - name: Backup and Deploy API Executable
        run: |
          $apiBackup = "$env:IIS_DOC_ROOT\api_backup.exe"
          $apiExecutable = "$env:IIS_DOC_ROOT\api.exe"

          if (Test-Path $apiBackup) { Remove-Item -Force $apiBackup }
          if (Test-Path $apiExecutable) { Rename-Item -Path $apiExecutable -NewName "api_backup.exe" }

          Copy-Item -Path "${{ github.workspace }}\api.exe" -Destination $env:IIS_DOC_ROOT
        shell: powershell

      - name: Start NSSM Service
        run: nssm start ${{ env.SERVICE_NAME }}
        continue-on-error: true

      - name: Status NSSM Service
        run: nssm status ${{ env.SERVICE_NAME }}

      - name: Restart IIS Site and App Pool
        run: |
          Import-Module WebAdministration
          $siteName = "${{ env.SERVICE_NAME }}"
          $appPoolName = (Get-Item "IIS:\Sites\$siteName").applicationPool

          if ((Get-Website -Name $siteName).State -eq "Started") {
            Stop-Website -Name $siteName
          }

          Restart-WebAppPool -Name $appPoolName
          Start-Website -Name $siteName
        shell: powershell

      - name: Post Cleanup build
        if: always()
        run: |
          Get-ChildItem -Force
          Remove-Item -Recurse -Force * -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force .??* -ErrorAction SilentlyContinue
          Get-ChildItem -Force
        shell: powershell

      - name: Notify Teams
        if: always()
        shell: powershell
        run: |
          $projectName = $env:PROJECT_NAME
          $githubActor = $env:GITHUB_ACTOR
          $githubRefName = $env:GITHUB_REF_NAME
          $status = "${{ job.status }}"
          $userLink = "https://github.com/$githubActor"

          if ($status -eq "success") {
            $color = "28A745"  # Green
            $title = "Deployment Successful"
            $text  = "**${projectName}** was successfully deployed by [**${githubActor}**](${userLink}) on branch **${githubRefName}**"
          }
          elseif ($status -eq "failure") {
            $color = "D93F0B"  # Red
            $title = "Deployment Failed"
            $text  = "**${projectName}** deployment failed by [**${githubActor}**](${userLink}) on branch **${githubRefName}**"
          }
          else {
            $color = "808080"  # Gray
            $title = "Deployment Status: $status"
            $text  = "**${projectName}** deployment ended with status: $status by [**${githubActor}**](${userLink}) on branch **${githubRefName}**"
          }

          $card = @{
              "@context"   = "http://schema.org/extensions"
              "@type"      = "MessageCard"
              "themeColor" = $color
              "title"      = $title
              "text"       = $text
          }

          $body = $card | ConvertTo-Json -Depth 10
          $headers = @{ "Content-Type" = "application/json" }

          Invoke-WebRequest -Uri $env:TEAMS_WEBHOOK_URL -Method Post -Headers $headers -Body $body -UseBasicParsing
