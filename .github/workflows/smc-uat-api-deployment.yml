name: smc-uat-api.jethur.com

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: jethur-uat
    env:
  
      PROJECT_NAME: smc-uat-api
      DB_NAME: jethur_smc_uat_db
      DEPLOY_BRANCH: main
      MIGRATION_BRANCH: migration
      IIS_DOC_ROOT: C:\inetpub\wwwroot\smc-uat\smc-uat-api
      SERVICE_NAME: smc-uat-api
      BACKUP_SCRIPT_PATH: C:\jethur-scripts\backup-for-deployment.ps1
      SCRIPT_SOURCE_PATH: C:\deployment\deployment-files\.env
      EMAIL_TO: nithin@jethur.com, shihab@jethur.com, ranjith@jethur.com, suhaila@jethur.com
      SENDER: "Jethur Notifications <info@jethur.com>"
      EMAIL_FROM: "Jethur Notifications <info@jethur.com>"

    steps:
      - name: Send Start Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.ZEPTO_HOST }}
          server_port: 587
          username: ${{ secrets.ZEPTO_USERNAME }}
          password: ${{ secrets.ZEPTO_PASSWORD }}
          subject: "Pipeline Started"
          body: |
            GitHub Actions deployment for ${{ env.PROJECT_NAME }} has started.

            Triggered by: ${{ github.actor }}
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}

      - name: Run SQL Backup Script
        shell: powershell
        run: |
         & "${{ env.BACKUP_SCRIPT_PATH }}" `
         -projectName "${{ env.PROJECT_NAME }}" `
         -projectWebPath "${{ env.IIS_DOC_ROOT }}" `
         -projectDbName "${{ env.DB_NAME }}"

         if ($LASTEXITCODE -ne 0) {
           Write-Error "Database backup failed. Aborting deployment."
           exit 1
         }

      - name: Pre Cleanup workspace
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning workspace before checkout..."
          Get-ChildItem -Force | ForEach-Object {
          try {
            Remove-Item -Recurse -Force $_.FullName -ErrorAction Stop
            } catch {
          Write-Warning "Could not delete: $($_.FullName) - $_"
          }
          }
          Write-Host "Workspace after cleanup:"
          Get-ChildItem -Force

      - name: Checkout Code
        uses: actions/checkout@v3
        with:
         clean: true
         fetch-depth: 0
        

      - name: Set Go Path
        run: $env:PATH = "C:\Program Files\Go\bin;$env:PATH"
        shell: powershell

      - name: Verify Go Version
        run: go version

      - name: Cache Go Modules
        uses: actions/cache@v3
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download .env
        run: Copy-Item -Path ${{ env.SCRIPT_SOURCE_PATH }} -Destination "${{ github.workspace }}\.env" -Force
        shell: powershell

      - name: Modify .env for Database Name
        run: |
          (Get-Content -Path "${{ github.workspace }}\.env") -replace "DatabaseName", "${{ env.DB_NAME }}" | Set-Content -Path "${{ github.workspace }}\.env"
        shell: powershell

      - name: Stop NSSM Service
        run: nssm stop ${{ env.SERVICE_NAME }}
        shell: powershell

      - name: Merge migration Branch
        run: git pull origin migration

      - name: Build migration.exe
        run: go build -o migration.exe .\cmd\migrate
        shell: powershell

      - name: Run Migrations and Seed
        run: |
          Write-Host "Running database migration..."
          .\migration.exe up
          if ($LASTEXITCODE -ne 0) {
          Write-Error "Migration failed!"
          exit 1
          }

          Write-Host "Running database seed..."
          .\migration.exe seed
          if ($LASTEXITCODE -ne 0) {
          Write-Error "Seeding failed!"
          exit 1
          }


      - name: Install Dependencies
        run: |
          go mod tidy
        shell: powershell

      - name: Build API
        run: go build ./cmd/api

      - name: Backup and Deploy API Executable
        run: |
          $apiBackup = "$env:IIS_DOC_ROOT\api_backup.exe"
          $apiExecutable = "$env:IIS_DOC_ROOT\api.exe"

          if (Test-Path $apiBackup) { Remove-Item -Force $apiBackup }
          if (Test-Path $apiExecutable) { Rename-Item -Path $apiExecutable -NewName "api_backup.exe" }

          Copy-Item -Path "${{ github.workspace }}\api.exe" -Destination $env:IIS_DOC_ROOT
        shell: powershell

      - name: Start NSSM Service
        run: nssm start ${{ env.SERVICE_NAME }}
        continue-on-error: true

      - name: Status NSSM Service
        run: nssm status ${{ env.SERVICE_NAME }}

      - name: Restart IIS Site and App Pool
        run: |
          Import-Module WebAdministration
          $siteName = "${{ env.SERVICE_NAME }}"
          $appPoolName = (Get-Item "IIS:\Sites\$siteName").applicationPool

          if ((Get-Website -Name $siteName).State -eq "Started") {
            Stop-Website -Name $siteName
          }

          Restart-WebAppPool -Name $appPoolName
          Start-Website -Name $siteName
        shell: powershell

      - name: Post Cleanup build
        if: always()
        run: |
          Get-ChildItem -Force
          Remove-Item -Recurse -Force * -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force .??* -ErrorAction SilentlyContinue
          Get-ChildItem -Force
        shell: powershell

      - name: Send Completion Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.ZEPTO_HOST }}
          server_port: 587
          username: ${{ secrets.ZEPTO_USERNAME }}
          password: ${{ secrets.ZEPTO_PASSWORD }}
          subject: "Pipeline Completed"
          body: "GitHub Actions deployment for ${{ env.PROJECT_NAME }} completed successfully."
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
